<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="mBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3E62"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="8" fill="url(#mBg)"/>
  <!-- Industrial Mineral Heap / Packaged Jumbo Bags -->
  <g transform="translate(110, 60)">
    <!-- 1 Ton FIBC Jumbo Bulk Bag for minerals -->
    <rect x="40" y="40" width="100" height="110" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Lifting loops -->
    <path d="M 40,40 C 40,15 65,15 65,40" stroke="#0284C7" stroke-width="4" fill="none"/>
    <path d="M 115,40 C 115,15 140,15 140,40" stroke="#0284C7" stroke-width="4" fill="none"/>
    <!-- Bag Details -->
    <line x1="40" y1="80" x2="140" y2="80" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="55" y="90" width="70" height="30" fill="#E0F2FE" rx="2"/>
    <text x="90" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#0369A1" text-anchor="middle">BENTONITE / SILICA</text>
    <text x="90" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#0284C7" text-anchor="middle">1000 KG BULK BAG</text>
  </g>
  <rect x="24" y="24" width="145" height="26" rx="4" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
  <text x="96" y="41" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">INDUSTRIAL BENTONITE</text>
</svg>

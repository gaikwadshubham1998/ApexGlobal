<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="8" fill="url(#bgG)"/>
  <!-- Rice Bowl & Grains -->
  <g transform="translate(100, 50)">
    <ellipse cx="100" cy="140" rx="85" ry="30" fill="#334155"/>
    <ellipse cx="100" cy="130" rx="80" ry="25" fill="#475569"/>
    <!-- Rice Mound -->
    <path d="M 30,125 Q 100,50 170,125 Z" fill="#F8FAFC"/>
    <!-- Individual Long Grains detail -->
    <g fill="#E2E8F0" stroke="#CBD5E1" stroke-width="0.8">
      <ellipse cx="75" cy="100" rx="9" ry="2.5" transform="rotate(-25, 75, 100)"/>
      <ellipse cx="95" cy="85" rx="9" ry="2.5" transform="rotate(15, 95, 85)"/>
      <ellipse cx="120" cy="95" rx="10" ry="2.5" transform="rotate(-10, 120, 95)"/>
      <ellipse cx="110" cy="115" rx="9" ry="2.5" transform="rotate(35, 110, 115)"/>
      <ellipse cx="60" cy="118" rx="9" ry="2.5" transform="rotate(-5, 60, 118)"/>
      <ellipse cx="140" cy="110" rx="9" ry="2.5" transform="rotate(20, 140, 110)"/>
    </g>
  </g>
  <!-- Stamp / Origin Chip -->
  <rect x="24" y="24" width="105" height="26" rx="4" fill="#D9A441" fill-opacity="0.2" stroke="#D9A441" stroke-width="1"/>
  <text x="76" y="41" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FDE047" text-anchor="middle">1121 STEAM</text>
</svg>

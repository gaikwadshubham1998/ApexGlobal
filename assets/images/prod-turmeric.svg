<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="bgG2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1500"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="turmG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="8" fill="url(#bgG2)"/>
  <!-- Turmeric Fingers and Powder -->
  <g transform="translate(100, 60)">
    <!-- Turmeric Fingers (Rhizomes) -->
    <path d="M 40,110 C 60,90 90,85 120,105 C 150,125 160,115 170,125 C 160,140 120,135 90,125 Z" fill="url(#turmG)"/>
    <path d="M 70,135 C 90,120 120,125 150,140 C 130,160 100,155 70,145 Z" fill="#B45309"/>
    <path d="M 110,95 C 125,75 145,80 155,95 Z" fill="#F59E0B"/>
    <!-- Ring Ridges -->
    <path d="M 70,100 L 75,115 M 95,95 L 98,115 M 125,110 L 128,125" stroke="#78350F" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Ground Powder heap -->
    <ellipse cx="60" cy="150" rx="40" ry="14" fill="#F59E0B"/>
    <ellipse cx="60" cy="147" rx="34" ry="10" fill="#FDE047"/>
  </g>
  <rect x="24" y="24" width="125" height="26" rx="4" fill="#D9A441" fill-opacity="0.2" stroke="#D9A441" stroke-width="1"/>
  <text x="86" y="41" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FDE047" text-anchor="middle">SALEM GRADE FINGER</text>
</svg>

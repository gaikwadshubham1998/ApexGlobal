<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="chemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A5F" />
    </linearGradient>
    <linearGradient id="crystalG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#chemBg)" />
  <circle cx="450" cy="150" r="130" fill="#38BDF8" opacity="0.08" />

  <!-- Geometric Mineral Crystals & Chemical Molecular Structure -->
  <g transform="translate(150, 70)">
    <!-- Molecular Bonds -->
    <g stroke="#38BDF8" stroke-width="2" opacity="0.5">
      <line x1="80" y1="60" x2="140" y2="40" />
      <line x1="140" y1="40" x2="180" y2="80" />
      <line x1="180" y1="80" x2="160" y2="140" />
      <line x1="160" y1="140" x2="100" y2="140" />
      <line x1="100" y1="140" x2="80" y2="60" />
    </g>
    <!-- Molecule Atoms -->
    <circle cx="80" cy="60" r="8" fill="#F3BA45" />
    <circle cx="140" cy="40" r="7" fill="#38BDF8" />
    <circle cx="180" cy="80" r="9" fill="#F3BA45" />
    <circle cx="160" cy="140" r="6" fill="#38BDF8" />
    <circle cx="100" cy="140" r="8" fill="#F3BA45" />

    <!-- 3D Geometric Mineral Crystal Pyramids -->
    <g transform="translate(180, 80)">
      <!-- Main Faceted Crystal -->
      <polygon points="60,20 100,80 60,160 20,80" fill="url(#crystalG)" opacity="0.85" />
      <polygon points="60,20 100,80 60,160" fill="#0284C7" opacity="0.95" />
      <polygon points="60,20 60,160 20,80" fill="#7DD3FC" opacity="0.75" />
      <line x1="60" y1="20" x2="60" y2="160" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />

      <!-- Smaller Gold Crystal -->
      <polygon points="120,70 145,110 120,160 95,110" fill="#F59E0B" opacity="0.85" />
      <polygon points="120,70 145,110 120,160" fill="#D97706" />
      <polygon points="120,70 120,160 95,110" fill="#FDE68A" opacity="0.8" />
    </g>
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(40, 310)">
    <rect width="270" height="52" rx="8" fill="#0B1B2B" fill-opacity="0.88" stroke="#D9A441" stroke-width="1.2" />
    <text x="18" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Chemicals &amp; Industrial Minerals</text>
    <text x="18" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#CBD5E1">Silica &bull; Bentonite &bull; Industrial Salts</text>
  </g>
</svg>

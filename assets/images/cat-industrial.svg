<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="indBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="steelG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#indBg)" />
  <circle cx="480" cy="120" r="140" fill="#2563EB" opacity="0.1" />

  <!-- Industrial Gear Cluster & Flanged Pipe -->
  <g transform="translate(160, 70)">
    <!-- Main Large Gear -->
    <g transform="translate(140, 130)">
      <circle cx="0" cy="0" r="75" fill="url(#steelG)" />
      <!-- Teeth -->
      <path d="M -15,-85 L 15,-85 L 12,-72 L -12,-72 Z" fill="#94A3B8" />
      <path d="M 60,-60 L 82,-40 L 70,-32 L 52,-48 Z" fill="#94A3B8" />
      <path d="M 72,-12 L 85,-15 L 85,15 L 72,12 Z" fill="#94A3B8" />
      <path d="M 52,48 L 70,32 L 82,40 L 60,60 Z" fill="#94A3B8" />
      <path d="M -12,72 L 12,72 L 15,85 L -15,85 Z" fill="#94A3B8" />
      <path d="M -60,60 L -52,48 L -70,32 L -82,40 Z" fill="#94A3B8" />
      <path d="M -72,12 L -85,15 L -85,-15 L -72,-12 Z" fill="#94A3B8" />
      <path d="M -82,-40 L -70,-32 L -52,-48 L -60,-60 Z" fill="#94A3B8" />
      <!-- Gear Hub -->
      <circle cx="0" cy="0" r="45" fill="#0F172A" />
      <circle cx="0" cy="0" r="24" fill="url(#steelG)" />
      <circle cx="0" cy="0" r="12" fill="#0F172A" />
    </g>

    <!-- Interlocking Small Gold Gear -->
    <g transform="translate(245, 60)">
      <circle cx="0" cy="0" r="45" fill="url(#goldG)" />
      <circle cx="0" cy="0" r="28" fill="#1E293B" />
      <circle cx="0" cy="0" r="14" fill="url(#goldG)" />
    </g>

    <!-- Industrial Valve / Flange Blueprint line -->
    <g transform="translate(30, 90)" stroke="#38BDF8" stroke-width="2" opacity="0.6">
      <line x1="0" y1="40" x2="60" y2="40" />
      <circle cx="30" cy="40" r="18" fill="none" />
      <line x1="30" y1="22" x2="30" y2="0" stroke-width="3" />
      <line x1="16" y1="0" x2="44" y2="0" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Fasteners & Precision Hex Bolts -->
    <g transform="translate(40, 180)">
      <!-- Hex Bolt 1 -->
      <polygon points="20,0 40,10 40,30 20,40 0,30 0,10" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5" />
      <rect x="14" y="38" width="12" height="35" fill="url(#steelG)" />
      <line x1="14" y1="46" x2="26" y2="46" stroke="#334155" stroke-width="1.5" />
      <line x1="14" y1="54" x2="26" y2="54" stroke="#334155" stroke-width="1.5" />
      <line x1="14" y1="62" x2="26" y2="62" stroke="#334155" stroke-width="1.5" />

      <!-- Hex Nut 2 -->
      <polygon points="65,25 85,35 85,55 65,65 45,55 45,35" fill="url(#goldG)" />
      <circle cx="65" cy="45" r="10" fill="#1E293B" />
    </g>
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(40, 310)">
    <rect width="280" height="52" rx="8" fill="#0B1B2B" fill-opacity="0.88" stroke="#D9A441" stroke-width="1.2" />
    <text x="18" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Industrial &amp; Engineering Goods</text>
    <text x="18" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#CBD5E1">Valves &bull; Fasteners &bull; Casting &bull; Flanges</text>
  </g>
</svg>

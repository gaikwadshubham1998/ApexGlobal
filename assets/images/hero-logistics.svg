<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none" class="hero-logistics-vector">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1B2B" />
      <stop offset="60%" stop-color="#163A5F" />
      <stop offset="100%" stop-color="#1E4D7B" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E2942" />
      <stop offset="100%" stop-color="#071524" />
    </linearGradient>
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D9A441" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F3BA45" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0F2438" />
      <stop offset="100%" stop-color="#1E3E62" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky & Atmospheric Ambient -->
  <rect width="800" height="380" fill="url(#skyGrad)" />
  
  <!-- Subtle Global Grid Coordinates -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="0.8">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="160" y1="0" x2="160" y2="380" />
    <line x1="320" y1="0" x2="320" y2="380" />
    <line x1="480" y1="0" x2="480" y2="380" />
    <line x1="640" y1="0" x2="640" y2="380" />
  </g>

  <!-- Flight / Sea Route Flightpaths (Trade Corridors) -->
  <path d="M 80,120 Q 280,30 450,110 T 740,90" fill="none" stroke="#D9A441" stroke-width="2" stroke-dasharray="6,6" opacity="0.85" />
  <circle cx="80" cy="120" r="4" fill="#D9A441" />
  <circle cx="450" cy="110" r="5" fill="#F3BA45" filter="url(#glowEffect)" />
  <circle cx="740" cy="90" r="4" fill="#D9A441" />

  <path d="M 120,220 Q 360,140 620,180" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="4,4" opacity="0.7" />
  <circle cx="120" cy="220" r="3.5" fill="#38BDF8" />
  <circle cx="620" cy="180" r="4" fill="#38BDF8" />

  <!-- Distant Port Cranes & Terminal Silhouettes -->
  <g opacity="0.4" stroke="#475569" stroke-width="2" fill="none">
    <!-- Crane 1 -->
    <path d="M 80,310 L 110,210 L 130,210 L 160,310 M 110,210 L 190,170 L 60,195 M 145,190 L 145,260" />
    <!-- Crane 2 -->
    <path d="M 620,310 L 645,225 L 665,225 L 690,310 M 645,225 L 730,190 L 600,210 M 680,210 L 680,270" />
  </g>

  <!-- Deep Ocean Surface -->
  <rect y="360" width="800" height="160" fill="url(#seaGrad)" />
  <path d="M 0,360 Q 200,356 400,360 T 800,360 L 800,520 L 0,520 Z" fill="#0C2034" opacity="0.6"/>

  <!-- Modern Container Mega-Vessel (Apex Trade Carrier) -->
  <g transform="translate(180, 240)">
    <!-- Bridge & Superstructure -->
    <rect x="360" y="20" width="45" height="60" rx="3" fill="#E2E8F0" />
    <rect x="375" y="0" width="15" height="20" rx="1" fill="#CBD5E1" />
    <!-- Radar mast -->
    <line x1="382" y1="0" x2="382" y2="-18" stroke="#F3BA45" stroke-width="2" />
    <line x1="376" y1="-12" x2="388" y2="-12" stroke="#F3BA45" stroke-width="1.5" />
    <!-- Bridge Windows -->
    <rect x="364" y="28" width="37" height="6" rx="1" fill="#0F172A" />

    <!-- Stacked Shipping Containers (Vibrant Multi-Color Realism) -->
    <!-- Tier 3 (Top) -->
    <rect x="80" y="44" width="48" height="18" rx="1" fill="#D9A441" />
    <rect x="132" y="44" width="48" height="18" rx="1" fill="#1E3E62" />
    <rect x="184" y="44" width="48" height="18" rx="1" fill="#B91C1C" />
    <rect x="236" y="44" width="48" height="18" rx="1" fill="#0D9488" />
    <rect x="288" y="44" width="48" height="18" rx="1" fill="#D9A441" />

    <!-- Tier 2 (Middle) -->
    <rect x="65" y="64" width="48" height="18" rx="1" fill="#0D9488" />
    <rect x="117" y="64" width="48" height="18" rx="1" fill="#D9A441" />
    <rect x="169" y="64" width="48" height="18" rx="1" fill="#1E3E62" />
    <rect x="221" y="64" width="48" height="18" rx="1" fill="#2563EB" />
    <rect x="273" y="64" width="48" height="18" rx="1" fill="#B91C1C" />
    <rect x="325" y="64" width="30" height="18" rx="1" fill="#0D9488" />

    <!-- Tier 1 (Base Layer) -->
    <rect x="50" y="84" width="48" height="18" rx="1" fill="#1E3E62" />
    <rect x="102" y="84" width="48" height="18" rx="1" fill="#B91C1C" />
    <rect x="154" y="84" width="48" height="18" rx="1" fill="#D9A441" />
    <rect x="206" y="84" width="48" height="18" rx="1" fill="#0D9488" />
    <rect x="258" y="84" width="48" height="18" rx="1" fill="#1E3E62" />
    <rect x="310" y="84" width="45" height="18" rx="1" fill="#2563EB" />

    <!-- Container Rib Details on selected boxes -->
    <g stroke="#000000" stroke-width="0.75" opacity="0.3">
      <line x1="90" y1="44" x2="90" y2="62" />
      <line x1="102" y1="44" x2="102" y2="62" />
      <line x1="114" y1="44" x2="114" y2="62" />
      <line x1="142" y1="44" x2="142" y2="62" />
      <line x1="154" y1="44" x2="154" y2="62" />
    </g>

    <!-- Cargo Vessel Hull (Sharp Bow, Red Antifouling Bottom, Dark Top) -->
    <!-- Top Hull -->
    <path d="M 15,102 L 430,102 L 420,132 L 60,132 Z" fill="url(#hullGrad)" />
    <!-- White Stripe -->
    <line x1="25" y1="105" x2="428" y2="105" stroke="#FFFFFF" stroke-width="2" opacity="0.7" />
    <!-- Red Antifouling Keel/Bottom -->
    <path d="M 60,132 L 420,132 L 410,148 L 100,148 Z" fill="#991B1B" />

    <!-- Ship Name on Bow -->
    <text x="35" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#F8FAFC" letter-spacing="1">APEX CARRIER</text>

    <!-- Bow Wave & Wake Reflection -->
    <path d="M 0,135 Q 25,142 55,138" fill="none" stroke="#93C5FD" stroke-width="3" opacity="0.75" stroke-linecap="round" />
    <path d="M 30,142 Q 150,150 430,145" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- Glowing Trade Anchor Badge / Floating Metric -->
  <g transform="translate(60, 410)">
    <rect width="210" height="60" rx="8" fill="#102A43" fill-opacity="0.92" stroke="#D9A441" stroke-width="1.5" />
    <circle cx="32" cy="30" r="18" fill="#163A5F" />
    <!-- Global Arrow Icon -->
    <path d="M 26,30 L 38,30 M 34,24 L 40,30 L 34,36" stroke="#F3BA45" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Cross-Border Trading</text>
    <text x="60" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#94A3B8">FOB &#8226; CIF &#8226; CFR Global Incoterms</text>
  </g>
</svg>

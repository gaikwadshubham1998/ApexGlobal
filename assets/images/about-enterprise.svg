<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="abBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1B2B"/>
      <stop offset="100%" stop-color="#163A5F"/>
    </linearGradient>
    <linearGradient id="abGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D9A441"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" rx="16" fill="url(#abBg)"/>
  
  <!-- Global Trading Operations Graphic -->
  <!-- Central Globe & Verification Rings -->
  <g transform="translate(300, 200)">
    <!-- Globe circles -->
    <circle cx="0" cy="0" r="120" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,4" fill="none" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="120" ry="45" stroke="#38BDF8" stroke-width="1" fill="none" opacity="0.3"/>
    <ellipse cx="0" cy="0" rx="45" ry="120" stroke="#38BDF8" stroke-width="1" fill="none" opacity="0.3"/>
    <circle cx="0" cy="0" r="85" fill="#102A43" stroke="#D9A441" stroke-width="2"/>
    
    <!-- Trade Hub Core Icon -->
    <path d="M -30,0 L 30,0 M 15,-15 L 30,0 L 15,15" stroke="url(#abGold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 30,0 L -30,0 M -15,15 L -30,0 L -15,-15" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 4 Orbiting Pillars of Trust -->
  <!-- Top Left: Sourcing Integrity -->
  <g transform="translate(80, 70)">
    <rect width="180" height="65" rx="8" fill="#1E3E62" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1"/>
    <text x="18" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Direct Sourcing</text>
    <text x="18" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#94A3B8">Verified Factory &amp; Farm Audits</text>
  </g>

  <!-- Top Right: Quality Control -->
  <g transform="translate(340, 70)">
    <rect width="180" height="65" rx="8" fill="#1E3E62" fill-opacity="0.9" stroke="#D9A441" stroke-width="1"/>
    <text x="18" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Quality Assurance</text>
    <text x="18" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#94A3B8">Pre-Shipment Inspections (SGS/TUV)</text>
  </g>

  <!-- Bottom Left: Regulatory Compliance -->
  <g transform="translate(80, 320)">
    <rect width="180" height="65" rx="8" fill="#1E3E62" fill-opacity="0.9" stroke="#D9A441" stroke-width="1"/>
    <text x="18" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Trade Compliance</text>
    <text x="18" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#94A3B8">IEC, BL, COO &amp; Phytosanitary</text>
  </g>

  <!-- Bottom Right: Logistics Security -->
  <g transform="translate(340, 320)">
    <rect width="180" height="65" rx="8" fill="#1E3E62" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1"/>
    <text x="18" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Port-to-Port Tracking</text>
    <text x="18" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#94A3B8">Incoterms 2020 (FOB, CIF, CFR)</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="vBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="vMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="8" fill="url(#vBg)"/>
  <!-- Industrial Gate Valve Graphic -->
  <g transform="translate(140, 50)">
    <!-- Handwheel (Top) -->
    <ellipse cx="60" cy="20" rx="42" ry="12" fill="#DC2626"/>
    <ellipse cx="60" cy="20" rx="34" ry="8" fill="#991B1B"/>
    <ellipse cx="60" cy="20" rx="10" ry="3" fill="#DC2626"/>
    <!-- Stem -->
    <rect x="56" y="24" width="8" height="40" fill="#E2E8F0"/>
    <!-- Bonnet -->
    <polygon points="40,64 80,64 90,95 30,95" fill="url(#vMetal)"/>
    <!-- Flange Body -->
    <rect x="25" y="95" width="70" height="55" fill="url(#vMetal)"/>
    <!-- Left Flange -->
    <rect x="0" y="85" width="25" height="75" rx="3" fill="#475569"/>
    <circle cx="12" cy="98" r="3.5" fill="#1E293B"/>
    <circle cx="12" cy="148" r="3.5" fill="#1E293B"/>
    <!-- Right Flange -->
    <rect x="95" y="85" width="25" height="75" rx="3" fill="#475569"/>
    <circle cx="108" cy="98" r="3.5" fill="#1E293B"/>
    <circle cx="108" cy="148" r="3.5" fill="#1E293B"/>
  </g>
  <rect x="24" y="24" width="135" height="26" rx="4" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
  <text x="91" y="41" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">CLASS 150/300 VALVES</text>
</svg>

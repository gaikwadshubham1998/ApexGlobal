<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="zinc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="8" fill="url(#fBg)"/>
  <!-- Precision Fasteners Cluster -->
  <g transform="translate(110, 60)">
    <!-- Giant Hex Bolt -->
    <g transform="translate(60, 20) rotate(35)">
      <polygon points="35,0 70,20 70,60 35,80 0,60 0,20" fill="url(#zinc)" stroke="#475569" stroke-width="2"/>
      <rect x="20" y="80" width="30" height="95" fill="url(#zinc)"/>
      <!-- Thread ridges -->
      <g stroke="#334155" stroke-width="2.5">
        <line x1="20" y1="95" x2="50" y2="95"/>
        <line x1="20" y1="110" x2="50" y2="110"/>
        <line x1="20" y1="125" x2="50" y2="125"/>
        <line x1="20" y1="140" x2="50" y2="140"/>
        <line x1="20" y1="155" x2="50" y2="155"/>
        <line x1="20" y1="170" x2="50" y2="170"/>
      </g>
    </g>
    <!-- Heavy Hex Nut -->
    <g transform="translate(15, 110)">
      <polygon points="25,0 50,15 50,45 25,60 0,45 0,15" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
      <circle cx="25" cy="30" r="14" fill="#0F172A"/>
    </g>
  </g>
  <rect x="24" y="24" width="135" height="26" rx="4" fill="#D9A441" fill-opacity="0.2" stroke="#D9A441" stroke-width="1"/>
  <text x="91" y="41" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FDE047" text-anchor="middle">GRADE 8.8 / 10.9 DIN</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="flBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="ssGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="8" fill="url(#flBg)"/>
  <!-- Forged Pipe Flange Graphic -->
  <g transform="translate(200, 140)">
    <!-- Outer Flange Disc -->
    <ellipse cx="0" cy="0" rx="90" ry="45" fill="url(#ssGrad)" stroke="#475569" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="82" ry="40" fill="#E2E8F0"/>
    <!-- Bolt Holes Around Rim -->
    <ellipse cx="-65" cy="0" rx="6" ry="3.5" fill="#1E293B"/>
    <ellipse cx="65" cy="0" rx="6" ry="3.5" fill="#1E293B"/>
    <ellipse cx="-45" cy="-22" rx="6" ry="3.5" fill="#1E293B"/>
    <ellipse cx="45" cy="-22" rx="6" ry="3.5" fill="#1E293B"/>
    <ellipse cx="-45" cy="22" rx="6" ry="3.5" fill="#1E293B"/>
    <ellipse cx="45" cy="22" rx="6" ry="3.5" fill="#1E293B"/>
    <ellipse cx="0" cy="-30" rx="6" ry="3.5" fill="#1E293B"/>
    <ellipse cx="0" cy="30" rx="6" ry="3.5" fill="#1E293B"/>
    <!-- Raised Face Hub & Bore -->
    <ellipse cx="0" cy="0" rx="42" ry="21" fill="url(#ssGrad)" stroke="#334155" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="25" ry="12.5" fill="#0F172A"/>
  </g>
  <rect x="24" y="24" width="150" height="26" rx="4" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
  <text x="99" y="41" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">ANSI B16.5 SS FLANGES</text>
</svg>
